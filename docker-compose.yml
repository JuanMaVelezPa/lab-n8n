services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:3.2.0
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_HOST=lab-n8n.jotaeme.dev
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://lab-n8n.jotaeme.dev/
      - N8N_WEBHOOK_URL=https://lab-n8n.jotaeme.dev/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default   # private floor: n8n-runners reaches the broker at n8n:5679
      - edge      # lobby: cloudflared (jotaeme-ingress) reaches n8n:5678
      - llm       # n8n calls http://ollama:11434 (jotaeme-llm)

  n8n-runners:
    image: n8nio/runners:3.2.0
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n
    networks:
      - default

volumes:
  n8n_data:
    # Keeps the volume created under the old project name `n8n`.
    # Never remove this line: without it Compose creates an empty lab-n8n_n8n_data.
    # Compose warns that the volume was created for project "n8n"; that is expected.
    # Never run `docker compose down -v`: it would delete this volume.
    name: n8n_n8n_data

networks:
  # Created once on the host by jotaeme-ingress.
  edge:
    external: true
  llm:
    external: true
